<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Proyecto Erome</title>
    <!-- Google Fonts para tipografía moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--border-color);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-header p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .input-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            position: relative;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            text-align: center;
        }

        .alert.success {
            display: block;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .alert.error {
            display: block;
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
        }

        .loader {
            display: none;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="form-container">
        <div class="form-header">
            <h2>Únete al Proyecto</h2>
            <p>Ingresa tus datos para enviar la información a la base de datos.</p>
        </div>

        <div id="alertMessage" class="alert"></div>

        <form id="contactForm">
            <div class="input-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="juan@ejemplo.com" required>
            </div>

            <div class="input-group">
                <label for="mensaje">Tu mensaje</label>
                <textarea id="mensaje" name="mensaje" placeholder="Escribe aquí tu mensaje..." required></textarea>
            </div>

            <button type="submit" id="submitBtn">
                <span id="btnText">Enviar Datos</span>
                <div id="btnLoader" class="loader"></div>
            </button>
        </form>
    </div>

    <!-- 1. Cargar el SDK de Supabase desde su CDN oficial -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ==============================================================================
        // 2. CONFIGURACIÓN DE SUPABASE
        // IMPORTANTE: Debes reemplazar estos valores con los de tu propio proyecto.
        // Ve a supabase.com -> Settings -> API y copia tu URL y tu "anon" public key.
        // ==============================================================================
        const SUPABASE_URL = 'https://jcddsibiycrawtfnudnk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjZGRzaWJpeWNyYXd0Zm51ZG5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MzYyMTQsImV4cCI6MjA5MzQxMjIxNH0.JeajEmnpSNuNqOC-bg0F_NslXKP3XrWwy8g0T0xIyAU';

        // Inicializamos el cliente de Supabase
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Obtenemos las referencias a los elementos de HTML
        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const alertMessage = document.getElementById('alertMessage');

        // Escuchamos el evento de envío del formulario
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue

            // Obtenemos los valores que escribió el usuario
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const mensaje = document.getElementById('mensaje').value;

            // Cambiamos el estilo del botón para mostrar que está cargando
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';
            alertMessage.className = 'alert'; // Limpiamos alertas previas

            try {
                // 3. INSERTAR DATOS EN SUPABASE
                // IMPORTANTE: Asegúrate de tener una tabla en Supabase llamada 'mensajes'
                // La tabla debe tener columnas con estos mismos nombres: nombre (text), email (text), mensaje (text)
                const { data, error } = await supabase
                    .from('mensajes')
                    .insert([
                        {
                            nombre: nombre,
                            email: email,
                            mensaje: mensaje
                        }
                    ]);

                if (error) throw error;

                // Si todo sale bien, mostramos mensaje de éxito y limpiamos el formulario
                showAlert('¡Tus datos se guardaron correctamente en la base de datos!', 'success');
                form.reset();

            } catch (error) {
                // Si hay un error (ej. credenciales inválidas o tabla no existe)
                console.error("Error de Supabase:", error);

                // Mensaje amigable si olvidaste poner las credenciales
                if (SUPABASE_URL === 'TU_SUPABASE_URL_AQUI') {
                    showAlert('Error: Debes colocar tu URL y KEY de Supabase en el código HTML.', 'error');
                } else {
                    showAlert('Hubo un error al guardar. Asegúrate de haber creado la tabla "mensajes".', 'error');
                }
            } finally {
                // Restauramos el botón a su estado normal
                submitBtn.disabled = false;
                btnText.style.display = 'block';
                btnLoader.style.display = 'none';
            }
        });

        // Función auxiliar para mostrar las alertas de colores
        function showAlert(text, type) {
            alertMessage.textContent = text;
            alertMessage.className = `alert ${type}`;
        }
    </script>
</body>

</html>
